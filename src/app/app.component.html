<header class="site-header">
  <a class="brand" routerLink="/">
    <img class="brand-mark" src="assets/logo-mark.png" alt="" width="119" height="128">
    <span class="brand-name">Glance<span class="brand-sync">Sync</span></span>
  </a>

  @if (currentUser(); as user) {
    <nav class="header-nav">
      <a routerLink="/chat" routerLinkActive="active" class="nav-link" title="Chats">
        <app-icon name="message" />
        <span class="nav-label">Chats</span>
        @if (unreadTotal() > 0) {
          <span class="badge" [attr.aria-label]="unreadTotal() + ' unread messages'">
            {{ unreadTotal() }}
          </span>
        }
      </a>

      <a routerLink="/events" routerLinkActive="active" class="nav-link" title="Dates">
        <app-icon name="calendar" />
        <span class="nav-label">Dates</span>
      </a>

      <a routerLink="/notifications" routerLinkActive="active" class="nav-link"
         title="Notifications" aria-label="Notifications">
        <app-icon name="bell" />
        <span class="nav-label">Alerts</span>
        @if (notificationUnread() > 0) {
          <span class="badge">{{ notificationUnread() }}</span>
        }
      </a>

      <a routerLink="/profile" routerLinkActive="active" class="username"
         [title]="(connected() ? 'Connected' : 'Reconnecting…') + ' · Edit profile'">
        <app-avatar class="avatar-tiny" [name]="user.username" [src]="user.avatarUrl">
          <span class="avatar-dot" [class.dot-online]="connected()"></span>
        </app-avatar>
        <span class="nav-label">{{ user.username }}</span>
      </a>

      <button type="button" class="icon-button" (click)="logout()" title="Log out" aria-label="Log out">
        <app-icon name="log-out" />
      </button>
    </nav>
  } @else {
    <nav class="header-nav">
      <a routerLink="/login">Sign in</a>
      <a routerLink="/register">Register</a>
    </nav>
  }
</header>

<main class="site-main">
  <router-outlet />
</main>

<app-call-overlay />

<footer class="site-footer">
  <small>GlanceSync · {{ year }}</small>
</footer>
