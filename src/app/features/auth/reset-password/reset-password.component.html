<section class="auth-card">
  <h1>Choose a new password</h1>
  @if (!token) {
    <p class="subtitle">This reset link is missing its token.</p>
    <a class="ghost-button" routerLink="/forgot-password">Request a new link</a>
  } @else {
    <p class="subtitle">Use at least 8 characters with a letter and a number.</p>
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label for="password">New password</label>
      <div class="password-field">
        <input id="password" [type]="showPassword() ? 'text' : 'password'"
               formControlName="password" autocomplete="new-password" />
        <button type="button" class="password-toggle" (click)="showPassword.set(!showPassword())"
                [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
                [attr.aria-pressed]="showPassword()">
          <app-icon [name]="showPassword() ? 'eye-off' : 'eye'" [size]="18" />
        </button>
      </div>
      <label for="confirmPassword">Confirm new password</label>
      <div class="password-field">
        <input id="confirmPassword" [type]="showConfirmPassword() ? 'text' : 'password'"
               formControlName="confirmPassword" autocomplete="new-password" />
        <button type="button" class="password-toggle"
                (click)="showConfirmPassword.set(!showConfirmPassword())"
                [attr.aria-label]="showConfirmPassword() ? 'Hide password' : 'Show password'"
                [attr.aria-pressed]="showConfirmPassword()">
          <app-icon [name]="showConfirmPassword() ? 'eye-off' : 'eye'" [size]="18" />
        </button>
      </div>
      @if (form.touched && form.hasError('mismatch')) {
        <small class="field-error">Passwords do not match.</small>
      }
      <button type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Saving…' : 'Save new password' }}
      </button>
    </form>
  }
</section>
