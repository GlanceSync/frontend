<section class="auth-card">
  <h1>Sign in</h1>
  <p class="subtitle">Welcome back to GlanceSync.</p>

  @if (needsVerification()) {
    <form class="resend" (submit)="$event.preventDefault(); resend()" novalidate>
      <label for="resendEmail">Didn't get the email? Send a new link to:</label>
      <input id="resendEmail" type="email" autocomplete="email"
             [value]="resendEmail()" (input)="resendEmail.set($any($event.target).value)" />
      <button type="submit" [disabled]="resending() || !resendEmail().trim()">
        {{ resending() ? 'Sending…' : 'Resend link' }}
      </button>
    </form>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label for="username">Username</label>
    <input id="username" type="text" formControlName="username" autocomplete="username" />
    @if (form.controls.username.touched && form.controls.username.invalid) {
      <small class="field-error">Username is required.</small>
    }

    <label for="password">Password</label>
    <div class="password-field">
      <input id="password" [type]="showPassword() ? 'text' : 'password'" formControlName="password" autocomplete="current-password" />
      <button type="button" class="password-toggle" (click)="showPassword.set(!showPassword())"
              [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
              [attr.aria-pressed]="showPassword()">
        <app-icon [name]="showPassword() ? 'eye-off' : 'eye'" [size]="18" />
      </button>
    </div>
    @if (form.controls.password.touched && form.controls.password.invalid) {
      <small class="field-error">Password is required.</small>
    }

    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>

  <p class="switch">No account yet? <a routerLink="/register">Create one</a></p>
</section>
