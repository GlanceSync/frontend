<section class="map-page">
  <header class="map-heading">
    <div>
      <h1>People near you</h1>
      <p class="subtitle">{{ loading() && !people().length ? 'Finding people near you…' : summary() }}</p>
    </div>
    <div class="map-actions">
      <button type="button" class="ghost-button" (click)="recenter()" [disabled]="locating()">
        <app-icon name="map-pin" [size]="16" />
        <span>{{ locating() ? 'Locating…' : 'Recenter' }}</span>
      </button>
      <button type="button" class="ghost-button" [class.active]="onlineOnly()"
              [attr.aria-pressed]="onlineOnly()" (click)="toggleOnlineOnly()">
        <span class="map-online-dot" aria-hidden="true"></span>
        <span>Online only</span>
      </button>
    </div>
  </header>

  @if (locationNotice(); as notice) {
    <div class="map-notice" role="status">
      <app-icon name="alert-circle" [size]="16" />
      <span>{{ notice }}</span>
      <a routerLink="/profile">Location settings</a>
    </div>
  }

  <div class="map-frame">
    <div #canvas class="map-canvas" role="application" aria-label="Map of people near you"></div>
    @if (loading()) {
      <span class="map-loading" aria-hidden="true">Loading…</span>
    }
  </div>
</section>
