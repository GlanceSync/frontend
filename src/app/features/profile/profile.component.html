<section class="panel profile-panel">
  <h1>Profile</h1>
  <p class="subtitle">Your photo shows in chats and on the screen of anyone you call.</p>

  @if (user(); as me) {
    <div class="profile-photo">
      <!-- The avatar is also a drop target, and a click on it opens the file picker. -->
      <label class="profile-drop" for="avatar-file" [class.dragging]="dragging()"
             (dragover)="onDragOver($event)" (dragleave)="dragging.set(false)"
             (drop)="onDrop($event)" title="Choose a photo">
        <app-avatar class="profile-avatar" [name]="me.username"
                    [src]="pending()?.url ?? me.avatarUrl" />
        <span class="profile-drop-hint" aria-hidden="true">
          <app-icon name="camera" [size]="22" />
        </span>
      </label>

      <div class="profile-photo-side">
        <span class="profile-name">{{ me.username }}</span>

        @if (pending()) {
          <small class="meta-line">This is how it will look. Save to use it.</small>
          <div class="profile-actions">
            <button type="button" class="solid-button" [disabled]="busy()" (click)="save()">
              {{ busy() ? 'Saving…' : 'Save photo' }}
            </button>
            <button type="button" class="ghost-button" [disabled]="busy()" (click)="cancel()">
              Cancel
            </button>
          </div>
        } @else {
          <small class="meta-line">JPEG, PNG or WebP. Drop an image on the circle or choose one.</small>
          <div class="profile-actions">
            <label class="ghost-button" for="avatar-file">
              <app-icon name="upload" [size]="16" />
              <span>{{ me.avatarUrl ? 'Change photo' : 'Upload photo' }}</span>
            </label>
            @if (me.avatarUrl) {
              <button type="button" class="ghost-button danger" [disabled]="busy()" (click)="remove()">
                Remove
              </button>
            }
          </div>
        }

        <input id="avatar-file" class="visually-hidden" type="file"
               accept="image/jpeg,image/png,image/webp,image/*"
               (change)="onFileChosen($event)" />
      </div>
    </div>
  }
</section>
